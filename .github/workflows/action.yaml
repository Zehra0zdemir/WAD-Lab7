name: Lab 7

# Requirement 4: Trigger the pipeline only on push or pull_request to the "test" branch
on:
  push:
    branches:
      - test
  pull_request:
    branches:
      - test

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the repository code
      - uses: actions/checkout@v4

      # Step 2: Force JDK 17 for JaCoCo compatibility
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      # Step 3: Make the Gradle wrapper executable
      - name: Grant execute permission for Gradle Wrapper
        run: chmod +x gradlew

      # GÜNCELLEME: Önceden kalan uyumsuz Java 25 önbelleğini temizlemek için 'clean' ekledik
      - name: Build with Gradle
        run: ./gradlew clean build -x test

      # GÜNCELLEME: Test aşamasına da temiz bir başlangıç verdik
      - name: Run Backend Tests
        run: ./gradlew test
        env:
          MY_SECRET_KEY: ${{ secrets.MY_SECRET_KEY }}

      # Step 6: Generate the JaCoCo code-coverage report
      - name: Generate JaCoCo Coverage Report
        run: ./gradlew jacocoTestReport
