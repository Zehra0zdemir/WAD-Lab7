name: Lab 7

# Requirement 4: Trigger the pipeline only on push or pull_request to the "test" branch
on:
  push:
    branches:
      - test
  pull_request:
    branches:
      - test

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the repository code
      - uses: actions/checkout@v4

      # DÜZELTME 1: JaCoCo ile tam uyumlu çalışması için Java sürümünü 17'ye sabitledik
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      # Step 3: Make the Gradle wrapper executable
      - name: Grant execute permission for Gradle Wrapper
        run: chmod +x gradlew

      # DÜZELTME 2: -x test ekleyerek build esnasında testlerin erkenden hatasız patlamasını engelledik
      - name: Build with Gradle
        run: ./gradlew build -x test

      # Requirement 1 & 2: Run all backend tests, injecting MY_SECRET_KEY from GitHub Secrets
      - name: Run Backend Tests
        run: ./gradlew test
        env:
          MY_SECRET_KEY: ${{ secrets.MY_SECRET_KEY }}

      # Requirement 3: Generate the JaCoCo code-coverage report
      - name: Generate JaCoCo Coverage Report
        run: ./gradlew jacocoTestReport
